<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lens · 视频设备管理</title><style>
:root{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#23334c;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.side{position:fixed;inset:0 auto 0 0;width:232px;background:#121d30;color:#95a7c2;padding:32px 20px;display:flex;flex-direction:column}.brand{font-size:25px;letter-spacing:-1px;font-weight:700;color:white;padding:0 16px 36px}.brand b{color:#66d5ba}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#8095b5;margin-top:8px;font-weight:400}.nav{border:0;background:transparent;text-align:left;color:inherit;display:flex;align-items:center;gap:13px;padding:14px 16px;margin:4px 0;border-radius:10px;width:100%}.nav.active{background:#263851;color:#fff}.nav:hover{background:#20314a}.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}.side-bottom{margin-top:auto;padding:20px 14px;font-size:12px;line-height:1.9;color:#7e91af}main{margin-left:232px;padding:38px 44px;max-width:1700px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px}h1{font-size:27px;margin:0 0 8px;letter-spacing:-.6px}h2{font-size:17px;margin:0 0 20px}h3{margin:0 0 8px;font-size:16px}p{color:#8390a4;line-height:1.7;margin:0}.actions{display:flex;gap:10px}.btn{border:1px solid #dce3ed;border-radius:9px;background:white;color:#496078;padding:10px 15px}.btn.primary{background:#243b60;color:white;border-color:#243b60}.btn.danger{color:#bb5360}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}.stat,.panel{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:24px;box-shadow:0 3px 12px #1c355404}.stat small{color:#8795aa}.stat strong{display:block;font-size:30px;margin:15px 0 5px;font-weight:600}.stat em{font-style:normal;color:#91a0b5;font-size:12px}.columns{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}.panel{margin-bottom:22px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.panel-head h2{margin:0}.chip{display:inline-flex;align-items:center;gap:7px;color:#2a997b;background:#eaf8f3;padding:6px 10px;border-radius:6px;font-size:12px;white-space:nowrap}.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.off{color:#a37c36;background:#faf3e5}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:12px;color:#8a97a9;font-weight:500;border-bottom:1px solid #edf0f5;padding:12px 15px}td{padding:18px 15px;border-bottom:1px solid #eff2f6;font-size:13px}td small{display:block;color:#91a0b2;margin-top:5px}.device{display:flex;align-items:center;gap:12px}.device-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:#edf3fc;color:#6289bb;font-size:23px}.muted{color:#8997ab;font-size:12px}.empty{padding:50px;text-align:center;color:#95a2b6}.search{border:1px solid #e0e7f0;background:#fafbfd;border-radius:8px;padding:10px 13px;min-width:220px}.stream{border-bottom:1px solid #edf0f5;padding:17px 0}.stream:last-child{border:0}.stream-top{display:flex;justify-content:space-between;gap:16px;margin-bottom:10px}.stream code,.code{display:block;background:#f4f7fb;padding:12px;border-radius:8px;overflow-wrap:anywhere;font:12px ui-monospace,monospace;color:#5a7392;line-height:1.7}.stream .btn{font-size:12px;padding:6px 10px;margin-top:10px}.info-row{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid #eef1f5}.info-row span{color:#8796aa}.info-row b{font-weight:500}.notice{padding:16px 18px;border:1px solid #e0eaf6;background:#f4f8fd;border-radius:10px;font-size:13px;line-height:1.8;color:#67809e;margin-bottom:22px}.topology-frame{width:100%;height:560px;border:0;border-radius:12px}.mini-topology{height:380px}.status-line{display:flex;gap:7px;align-items:center;color:#7e91a8;font-size:12px}.status-line i{width:7px;height:7px;background:#30b998;border-radius:50%}dialog{border:1px solid #e0e6ef;border-radius:18px;padding:30px;width:min(510px,calc(100vw - 32px));box-shadow:0 30px 100px #17253b40;color:#33445e}dialog::backdrop{background:#12203966;backdrop-filter:blur(4px)}label{display:block;color:#7d8ea4;font-size:12px;margin:18px 0 7px}input:not(.search){width:100%;border:1px solid #dce4ee;border-radius:9px;padding:12px;background:#fafbfd;color:#33445e}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.error{color:#b75664;font-size:13px;min-height:20px;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;background:#223653;color:white;padding:12px 22px;border-radius:10px;box-shadow:0 10px 40px #10203930;z-index:10}.hidden{display:none!important}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.mobile-logo{display:none}a{color:#577fab;text-decoration:none}@media(max-width:1050px){main{padding:28px 24px}.side{width:200px}main{margin-left:200px}.columns{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:18px}.detail-grid{grid-template-columns:1fr}}@media(max-width:700px){.side{width:72px;padding:22px 8px}.brand{font-size:20px;padding:0 8px 24px}.brand small,.nav span,.side-bottom{display:none}.nav{padding:10px 2px;flex-direction:column;gap:6px}.nav span{display:block;font-size:10px}.brand .word{display:none}main{margin-left:72px;padding:24px 16px}.topbar{align-items:flex-start;flex-wrap:wrap}h1{font-size:23px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:26px}.panel{padding:18px}.panel-head{flex-wrap:wrap}.search{width:100%;min-width:0}.topology-frame{height:460px}.actions .btn{padding:9px 12px}}
</style><aside class="side"><div class="brand"><b>◉</b> <span class="word">Lens</span><small>VIDEO MANAGEMENT</small></div><nav id="nav"></nav><div class="side-bottom">本地视频管理<br>192.168.10.10<span id="side-status"></span></div></aside><main><header class="topbar"><div><h1 id="page-title"></h1><p id="page-subtitle"></p></div><div class="actions"><button class="btn" id="login-button">管理员登录</button><button class="btn primary" id="add-button">＋ 添加摄像头</button></div></header><div id="content"></div><div class="status-line"><i></i><span id="update-time">正在连接中转服务</span></div></main>
<dialog id="login-dialog"><form id="login-form"><h2>管理员登录</h2><p>登录后可添加和管理摄像头。</p><label>用户名</label><input name="username" value="admin" autocomplete="username" required><label>密码</label><input name="password" type="password" autocomplete="current-password" required><div class="error"></div><div class="form-actions"><button type="button" class="btn" data-close>取消</button><button class="btn primary">登录</button></div></form></dialog>
<dialog id="camera-dialog"><form id="camera-form"><h2 id="form-title">添加摄像头</h2><p>使用摄像头的本地 RTSP 地址，中转服务会持续取流。</p><input name="id" type="hidden"><label>设备名称</label><input name="name" placeholder="例如：仓库入口" maxlength="80" required><label>位置</label><input name="location" placeholder="例如：一楼 / 东侧"><label>主码流 RTSP 地址</label><input name="source" placeholder="rtsp://用户名:密码@设备IP:554/路径" autocomplete="off" required><label>子码流地址（可选）</label><input name="subSource" placeholder="rtsp://…" autocomplete="off"><div class="notice" style="margin-top:16px;margin-bottom:0">通用接入保留摄像头原始编码。连接录像机前，请确认其支持对应编码；现有乔安设备继续使用专用 H.264 转码。</div><div class="error"></div><div class="form-actions"><button class="btn" type="button" data-close>取消</button><button class="btn primary">保存并接入</button></div></form></dialog>
<dialog id="delete-dialog"><h2>移除摄像头</h2><p id="delete-message"></p><div class="form-actions"><button class="btn" data-close>取消</button><button class="btn danger" id="confirm-delete">确认移除</button></div></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cameras=[],state={paths:[]},authed=false,page='overview',search='',deleteId=null;
const icons=['<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','<rect x="3" y="6" width="14" height="12" rx="2"/><path d="m17 10 4-3v10l-4-3"/>','<circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M10 8 6 16M14 8l4 8"/>','<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>','<path d="M4 4h16v6H4zm0 10h16v6H4zM7 7h1m-1 10h1"/>'];
const pages={overview:['总览','统一查看摄像头接入与视频流状态'],cameras:['摄像头','集中管理设备与取流配置'],topology:['网络拓扑','当前乔安链路 · 实时视频流向'],nvr:['录像机接入','查看每台设备的中转地址与兼容信息'],system:['系统状态','中转服务与本地管理信息']};
$('#nav').innerHTML=Object.entries(pages).map(([key,v],i)=>`<button class="nav" title="${v[0]}" aria-label="${v[0]}" data-page="${key}"><svg viewBox="0 0 24 24">${icons[i]}</svg><span>${v[0]}</span></button>`).join('');
function stream(c){return state.paths.filter(p=>c.paths.includes(p.name))}function ready(c){return stream(c).some(p=>p.ready)}function chip(on){return `<span class="chip ${on?'':'off'}">${on?'视频就绪':'等待输入'}</span>`}function rate(v){return v==null?'—':v>1e6?(v/1e6).toFixed(1)+' Mbps':Math.round(v/1000)+' kbps'}
function stats(){let n=cameras.filter(ready).length,b=state.paths.reduce((a,p)=>a+(p.bitrate||0),0),r=state.paths.reduce((a,p)=>a+p.readers,0);return `<div class="stats">${[['摄像头总数',cameras.length,'已登记设备'],['视频就绪',n,`${cameras.length-n} 台等待输入`],['中转入站码率',rate(b),'包含原始与转码流'],['取流连接',r,'包含内部转码连接']].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong><em>${x[2]}</em></div>`).join('')}</div>`}
function table(compact=false){const list=cameras.filter(c=>(c.name+' '+c.ip+' '+c.location).toLowerCase().includes(search.toLowerCase()));return `<div class="table-wrap"><table><thead><tr><th>设备</th><th>连接状态</th><th>IP 地址</th>${compact?'':'<th>位置</th><th>操作</th>'}</tr></thead><tbody>${list.map(c=>`<tr><td><div class="device"><div class="device-icon">▣</div><div>${esc(c.name)}<small>${c.protected?'专用转码接入':'通用 RTSP'}</small></div></div></td><td>${chip(ready(c))}</td><td>${esc(c.ip)}</td>${compact?'':`<td>${esc(c.location||'—')}</td><td><button class="btn" data-stream="${c.id}">接入信息</button> ${c.protected?'<span class="muted">已保护</span>':`<button class="btn" data-edit="${c.id}">修改</button> <button class="btn danger" data-delete="${c.id}">移除</button>`}</td>`}</tr>`).join('')||'<tr><td colspan="5" class="empty">没有匹配的摄像头</td></tr>'}</tbody></table></div>`}
function streamCards(c){return `<section class="panel" id="device-${c.id}"><div class="panel-head"><h2>${esc(c.name)}</h2>${chip(ready(c))}</div>${c.paths.map(name=>{const p=state.paths.find(x=>x.name===name),url='rtsp://192.168.10.10:8554/'+name;return `<div class="stream"><div class="stream-top"><b>${name.endsWith('/nvr')?'录像机专用 · H.264':name.endsWith('/sub')?'子码流':'主码流'}</b><span class="muted">${esc(p?.tracks.join(' / ')||'等待媒体信息')} · ${rate(p?.bitrate)}</span></div><code>${esc(url)}</code><button class="btn" data-copy="${esc(url)}">复制地址</button></div>`}).join('')}${c.protected?'<div class="notice" style="margin-top:18px;margin-bottom:0">海康 D15：ONVIF 地址 192.168.10.10，端口 8899。使用录像机专用 H.264 视频流。</div>':'<p style="margin-top:18px;font-size:12px">此设备提供通用 RTSP 中转。当前 ONVIF 服务仅用于乔安 D15，新设备需按录像机支持的 RTSP 自定义协议接入。</p>'}</section>`}
function render(){const focus=document.activeElement,selection=focus?.classList.contains('search')?focus.selectionStart:null;$('#page-title').textContent=pages[page][0];$('#page-subtitle').textContent=pages[page][1];document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('#login-button').textContent=authed?'退出管理':'管理员登录';let body='';
if(page==='overview')body=stats()+`<div class="columns"><section class="panel"><div class="panel-head"><h2>设备状态</h2><button class="btn" data-page="cameras">全部设备 →</button></div>${table(true)}</section><section class="panel"><div class="panel-head"><h2>中转运行</h2>${chip(state.ok)}</div><div class="info-row"><span>服务地址</span><b>192.168.10.10</b></div><div class="info-row"><span>RTSP</span><b>8554 / TCP</b></div><div class="info-row"><span>乔安 ONVIF</span><b>8899</b></div><div class="info-row"><span>管理模式</span><b>${authed?'管理员':'只读浏览'}</b></div></section></div><section class="panel"><div class="panel-head"><h2>乔安网络拓扑</h2><button class="btn" data-page="topology">展开查看 →</button></div><iframe class="topology-frame mini-topology" title="网络拓扑" src="/topology.html"></iframe></section>`;
if(page==='cameras')body=stats()+`<section class="panel"><div class="panel-head"><h2>所有摄像头 <span class="muted">${cameras.length} 台</span></h2><input class="search" placeholder="搜索名称、IP 或位置" value="${esc(search)}"></div>${table()}</section>`;
if(page==='topology')body=`<section class="panel"><div class="panel-head"><h2>乔安设备链路</h2><span class="muted">蓝色动态连线表示检测到视频流</span></div><iframe class="topology-frame" title="实时网络拓扑" src="/topology.html"></iframe></section><section class="panel"><h2>其他设备</h2>${cameras.filter(c=>!c.protected).length?cameras.filter(c=>!c.protected).map(c=>`<div class="info-row"><span>${esc(c.name)} · ${esc(c.ip)}</span><b>→ Ubuntu 中转 · 192.168.10.10</b></div>`).join(''):'<p>新增摄像头后，其接入关系会显示在这里。</p>'}</section>`;
if(page==='nvr')body='<div class="notice">“视频就绪”表示中转已建立输入流。录像是否写入硬盘，请在录像机端确认。通用设备保留原始编码，需与录像机兼容。</div>'+cameras.map(streamCards).join('');
if(page==='system')body=`<div class="detail-grid"><section class="panel"><h2>服务状态</h2>${[['视频中转',state.ok?'在线':'连接异常'],['实时刷新','每 3 秒'],['管理服务','192.168.10.10:8088'],['传输方式','RTSP over TCP']].map(x=>`<div class="info-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</section><section class="panel"><h2>配置与恢复</h2><p>设备配置保存在服务器，新增设备的取流路径在服务恢复后自动重建。现有乔安链路受保护，避免误操作影响录像。</p><p style="margin-top:16px">管理操作需登录。摄像头源地址中的账号密码保存在服务器配置文件中，不在设备列表返回。</p></section></div>`;
// Keep live topology frames mounted while the surrounding status updates.
const oldFrames=[...$('#content').querySelectorAll('iframe')];const holder=document.createElement('div');holder.innerHTML=body;holder.querySelectorAll('iframe').forEach((f,i)=>{if(oldFrames[i]&&oldFrames[i].className===f.className)f.replaceWith(oldFrames[i])});$('#content').replaceChildren(...holder.childNodes);if(selection!=null&&$('.search')){$('.search').focus();$('.search').setSelectionRange(selection,selection)}$('#update-time').textContent=state.ok?'最近检测 '+new Date(state.checkedAt*1000).toLocaleTimeString():'中转服务暂不可用，正在重试';}
async function request(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error||'操作失败');return b}function toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),2500)}function cameraForm(c){if(!authed){$('#login-dialog').showModal();return}const f=$('#camera-form');f.reset();f.elements.id.value=c?.id||'';f.elements.name.value=c?.name||'';f.elements.location.value=c?.location||'';$('#form-title').textContent=c?'修改摄像头（重新填写源地址）':'添加摄像头';f.querySelector('.error').textContent='';$('#camera-dialog').showModal()}
document.addEventListener('click',async e=>{const n=e.target.closest('button');if(!n)return;if(n.dataset.page){page=n.dataset.page;search='';render()}if(n.hasAttribute('data-close'))n.closest('dialog').close();if(n.dataset.stream){page='nvr';render();$('#device-'+n.dataset.stream)?.scrollIntoView({behavior:'smooth'})}if(n.dataset.edit)cameraForm(cameras.find(c=>c.id===n.dataset.edit));if(n.dataset.delete){if(!authed){$('#login-dialog').showModal();return}deleteId=n.dataset.delete;$('#delete-message').textContent='将停止“'+cameras.find(c=>c.id===deleteId).name+'”的中转并移除配置。其他设备不受影响。';$('#delete-dialog').showModal()}if(n.dataset.copy){try{await navigator.clipboard.writeText(n.dataset.copy);toast('地址已复制')}catch{const t=document.createElement('textarea');t.value=n.dataset.copy;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('地址已复制')}}});document.addEventListener('input',e=>{if(e.target.classList.contains('search')){search=e.target.value;render()}});
$('#add-button').onclick=()=>cameraForm();$('#login-button').onclick=async()=>{if(authed){await request('/api/logout',{});authed=false;render()}else $('#login-dialog').showModal()};$('#login-form').onsubmit=async e=>{e.preventDefault();try{await request('/api/login',Object.fromEntries(new FormData(e.target)));authed=true;$('#login-dialog').close();e.target.reset();e.target.elements.username.value='admin';render();toast('已登录')}catch(x){e.target.querySelector('.error').textContent=x.message}};$('#camera-form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button.primary');b.disabled=true;try{await request('/api/cameras',Object.fromEntries(new FormData(e.target)));$('#camera-dialog').close();page='cameras';await update();toast('配置已保存，正在连接摄像头')}catch(x){e.target.querySelector('.error').textContent=x.message}finally{b.disabled=false}};$('#confirm-delete').onclick=async()=>{try{await request('/api/cameras/delete',{id:deleteId});$('#delete-dialog').close();await update();toast('设备已移除')}catch(e){toast(e.message)}};
async function update(){try{const [s,c]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/cameras').then(r=>r.json())]);state=s;cameras=c.cameras;authed=c.authenticated;render()}catch(e){$('#update-time').textContent='管理服务连接中断，正在重试'}}render();update();setInterval(update,3000);
</script></html>
