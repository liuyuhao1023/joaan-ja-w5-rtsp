<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频拓扑</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#fff 0,#edf3fa 55%,#dfe8f4 100%)}body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(#9aafcc55 .8px,transparent .8px);background-size:24px 24px;mask-image:radial-gradient(ellipse,#0009,transparent 75%);pointer-events:none}svg{position:relative;width:min(1220px,100vw);height:min(850px,100svh);overflow:visible}.node{fill:url(#card);stroke:#fff;stroke-width:2;filter:url(#shadow)}.icon{fill:none;stroke:#527398;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}.link{fill:none;stroke:#c5d5e8;stroke-width:2}.flow{fill:none;stroke:#98abc1;stroke-width:2.5;stroke-dasharray:2 18;stroke-linecap:round;opacity:.35}.flow.active{stroke:#478bef;opacity:1;animation:travel 2.8s linear infinite;filter:url(#flowGlow)}.dot{fill:#a2b2c5;stroke:#fff;stroke-width:3}.online .dot{fill:#24ba93}.online .icon{stroke:#3c78c6}.pending .dot{fill:#e5b453}.halo{fill:none;stroke:#d3e1f2;stroke-width:1}.plate{fill:#cfdeef;opacity:.5}.device{transition:transform .25s;transform-box:fill-box;transform-origin:center}.device:hover{filter:brightness(1.025)}g[tabindex]{cursor:default;outline:none}g[tabindex]:focus .node,g[tabindex]:hover .node{stroke:#8cb7ed}.orbit{fill:none;stroke:#8ab4e5;stroke-width:1;stroke-dasharray:3 9;opacity:.45}@keyframes travel{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){.flow.active{animation:none;stroke-dasharray:none}}.details{position:fixed;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));padding:22px 24px;background:#ffffffed;backdrop-filter:blur(18px);border:1px solid #fff;border-radius:20px;box-shadow:0 12px 50px #47678d30;font:14px system-ui;color:#425d7c}.details[hidden]{display:none}.details h2{font-size:17px;margin:0 28px 16px 0;color:#244365}.details dl{display:grid;grid-template-columns:100px 1fr;gap:10px;margin:0}.details dt{color:#7c90a8}.details dd{margin:0;overflow-wrap:anywhere}.details button{position:absolute;right:14px;top:12px;border:0;background:transparent;color:#7087a3;font-size:24px;cursor:pointer}g[tabindex]{cursor:pointer}.device-name{font:600 17px system-ui;fill:#284c74;text-anchor:middle}.device-meta{font:13px system-ui;fill:#6e86a2;text-anchor:middle}.device-name,.device-meta{pointer-events:none}</style><svg viewBox="0 0 1100 790" role="img" aria-label="摄像头经光猫连接中转服务器，再经监控路由器连接录像机。绿色动态箭头表示检测到视频流。">

</svg><aside class="details" id="details" hidden aria-live="polite"><button type="button" aria-label="关闭详情">×</button><h2 id="detail-title"></h2><dl id="detail-fields"></dl></aside><script>
const el=id=>document.getElementById(id);function node(id,on,pending=false){el(id).setAttribute('class',on?'online':pending?'pending':'')}function flow(id,on){el(id).setAttribute('class','flow'+(on?' active':''));if(on)el(id).setAttribute('marker-end','url(#arrow)');else el(id).removeAttribute('marker-end')}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error();const s=await r.json(),main=s.paths.find(p=>p.name==='joaan/main'),out=s.paths.find(p=>p.name==='joaan/nvr'),input=!!(main?.ready&&main.bitrate>0),output=!!(out?.ready&&out.bitrate>0),reader=!!(output&&out.readers>0);node('camera',input);node('ont',!!s.network?.routeOk);node('server',output,!!s.ok);node('router',reader);node('nvr',reader);flow('camera-flow',input);flow('source-flow',input);flow('relay-flow',output);flow('router-flow',reader);flow('nvr-flow',reader);el('nvr').querySelector('title').textContent='海康录像机 · 192.168.20.20 · D15 · '+(reader?'中转检测到取流连接':'等待取流连接')}catch(e){for(const id of ['camera','ont','server','router','nvr'])node(id,false);document.querySelectorAll('.flow').forEach(p=>flow(p.id,false))}}const info={
